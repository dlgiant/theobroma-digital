name: Deploy Theobroma Digital

on:
  push:
    branches: [ main, develop, actions-new ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linting
        run: yarn lint

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Create mock data file
        run: |
          mkdir -p public
          echo '{"metadata":{"total_trees":0,"total_trail_points":0,"total_connections":0},"trees":[],"trail_points":[],"connections":[]}' > public/plantation-data.json

      - name: Check build
        run: yarn build

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    # Build artifacts for all branches (including feature branches for QA)
    if: needs.test.result == 'success'
    
    outputs:
      deployment-matrix: ${{ steps.export-deployment-matrix.outputs.deployment-matrix }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create mock data file
        run: |
          mkdir -p public
          echo '{"metadata":{"total_trees":0,"total_trail_points":0,"total_connections":0},"trees":[],"trail_points":[],"connections":[]}' > public/plantation-data.json

      - name: Build application
        run: yarn build
        env:
          BUILD_STATIC: 'true'
          API_BASE_URL: ${{ secrets.API_BASE_URL }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: |
            out/
            package.json
            next.config.ts
          retention-days: 1

      - name: Export deployment matrix
        id: export-deployment-matrix
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "deployment-matrix={\"include\":[{\"environment\":\"production\",\"url\":\"${{ secrets.PRODUCTION_URL }}\"}]}" >> $GITHUB_OUTPUT
          else
            echo "deployment-matrix={\"include\":[{\"environment\":\"staging\",\"url\":\"${{ secrets.STAGING_URL }}\"}]}" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy to ${{ matrix.environment}}
    runs-on: ubuntu-latest
    needs: build
    # Deploy all successful builds (feature branches get staging environment)
    if: needs.build.result == 'success'
    
    strategy:
      matrix: ${{ fromJSON(needs.build.outputs.deployment-matrix) }}
    
    environment:
      name: ${{ matrix.environment }}
      url: ${{ matrix.url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files

      - name: Install dependencies
        run: yarn install --frozen-lockfile --production=false

      # Docker deployment option
      - name: Set up Docker Buildx
        if: ${{ vars.DEPLOY_METHOD == 'docker' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: ${{ vars.DEPLOY_METHOD == 'docker' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY }}
          username: ${{ secrets.CONTAINER_USERNAME }}
          password: ${{ secrets.CONTAINER_PASSWORD }}

      - name: Build and push Docker image
        if: ${{ vars.DEPLOY_METHOD == 'docker' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.CONTAINER_REGISTRY }}/theobroma-digital:${{ github.sha }}
            ${{ secrets.CONTAINER_REGISTRY }}/theobroma-digital:${{ matrix.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # AWS S3 + CloudFront deployment option
      - name: Configure AWS credentials
        if: ${{ vars.DEPLOY_METHOD == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy to S3
        if: ${{ vars.DEPLOY_METHOD == 'aws' }}
        run: |
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET_NAME }} --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      # Vercel deployment option
      - name: Deploy to Vercel
        if: ${{ vars.DEPLOY_METHOD == 'vercel' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: ${{ matrix.environment == 'production' && '--prod' || '' }}

      # Generic server deployment via SSH
      - name: Deploy to Server via SSH
        if: ${{ vars.DEPLOY_METHOD == 'ssh' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin ${{ github.ref_name }}
            npm ci
            npm run build
            pm2 restart theobroma-digital || pm2 start npm --name "theobroma-digital" -- start

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    
    steps:
      - name: Notify Success
        if: ${{ needs.deploy.result == 'success' }}
        run: |
          echo "✅ Deployment successful!"
          # Add notification logic here (Slack, Discord, email, etc.)
          
      - name: Notify Failure
        if: ${{ needs.deploy.result == 'failure' }}
        run: |
          echo "❌ Deployment failed!"
          # Add notification logic here (Slack, Discord, email, etc.)
